name: Release Pipeline

# 免登录版本：版本号变更（pubspec.yaml 的 version）推送到 main 时自动构建
# Android APK 与 Windows 便携版，并发布 GitHub Release；也可手动触发。
on:
  push:
    branches: [ main ]
    paths:
      - 'pubspec.yaml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

env:
  DEMO_MODE: 'true'

jobs:
  version-check:
    name: Check Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should-release: ${{ steps.guard.outputs.should-release }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Read Version From pubspec.yaml
        id: version
        run: |
          VERSION="$(grep '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//; s/\+.*$//')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "pubspec version: $VERSION"

      - name: Guard Against Duplicate Release
        id: guard
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ steps.version.outputs.version }}" | grep -q .; then
            echo "Tag v${{ steps.version.outputs.version }} already exists, skip release."
            echo "should-release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag v${{ steps.version.outputs.version }} not found, start release."
            echo "should-release=true" >> "$GITHUB_OUTPUT"
          fi

  build-android:
    name: Build Android APK
    needs: version-check
    if: needs.version-check.outputs.should-release == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --dart-define=DEMO_MODE=true

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    name: Build Windows Zip
    needs: version-check
    if: needs.version-check.outputs.should-release == 'true'
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Release
        shell: pwsh
        run: flutter build windows --release --dart-define=DEMO_MODE=true

      - name: Package Windows Portable Zip
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath kaoyan-helper-windows.zip

      - name: Upload Windows Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: kaoyan-helper-windows.zip

  create-release:
    name: Publish GitHub Release
    needs: [ version-check, build-android, build-windows ]
    if: needs.version-check.outputs.should-release == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Rename Release Assets
        run: |
          V="${{ needs.version-check.outputs.version }}"
          mv release-assets/app-release.apk           "release-assets/kaoyan-helper-nologin-v${V}-android.apk"
          mv release-assets/kaoyan-helper-windows.zip "release-assets/kaoyan-helper-nologin-v${V}-windows.zip"
          ls -la release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version-check.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: 登科 v${{ needs.version-check.outputs.version }}（免登录版）
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
